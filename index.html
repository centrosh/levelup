body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(520px 420px at 8% 4%,rgba(142,166,147,.28),transparent 70%),radial-gradient(480px 380px at 96% 30%,rgba(194,166,110,.18),transparent 70%),radial-gradient(560px 460px at 30% 105%,rgba(124,150,168,.18),transparent 70%)}
body{
  font-family:var(--sans);color:var(--ink);background:var(--cream);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sand);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:28px 22px 48px}
.logo{display:block;width:min(300px,70vw);height:auto;margin:8px auto 0}
.plant{display:block;width:84px;height:auto;margin:0 auto}

/* Welcome */
.hero{text-align:center;padding:28px 0 8px}
.hero h1{font-weight:700;font-size:clamp(46px,7vw,68px);line-height:1;margin:38px 0 0;letter-spacing:-.035em;color:var(--teal)}
.hero .sub{font-size:clamp(19px,2.6vw,23px);font-weight:500;color:var(--ink);margin:12px 0 0;letter-spacing:-.005em}
.hero .rule{width:56px;height:3px;border-radius:3px;background:var(--teal);opacity:.35;margin:22px auto 20px}
.skills{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 auto;max-width:560px}
.skills span{display:inline-flex;align-items:center;gap:8px;background:rgba(251,250,246,.75);border:1px solid var(--line);border-radius:99px;padding:7px 14px 7px 12px;font-size:15px;font-weight:500;color:var(--ink)}
.skills i{width:9px;height:9px;border-radius:50%}
.hero .note{font-size:15.5px;color:var(--soft);margin:16px auto 0;max-width:480px;line-height:1.5}
.panel{background:var(--paper);border-radius:28px;padding:30px;margin-top:30px;box-shadow:0 1px 0 rgba(73,108,112,.08)}
.field label{display:block;font-weight:600;font-size:16px;margin-bottom:10px}
.field input{width:100%;font:inherit;font-size:20px;padding:16px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.field input:focus{border-color:var(--teal);outline:none}
.stage-title{font-weight:600;font-size:16px;margin:28px 0 12px}
.stages{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.stage{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px 18px 16px;color:var(--ink);min-height:118px}
.stage strong{display:block;font-size:19px;margin-bottom:4px}
.stage span{font-size:15px;color:var(--soft)}
.stage em{display:inline-block;font-style:normal;font-size:13px;margin-top:12px;padding:4px 10px;border-radius:99px;background:var(--cream);color:var(--soft)}
.stage[aria-pressed="true"]{border-color:var(--teal);background:#F1F4F2;box-shadow:inset 0 0 0 1.5px var(--teal)}
.stage:disabled{opacity:.55;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:99px;padding:18px 34px;font-size:18px;font-weight:600;background:var(--teal);color:#fff;min-width:220px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.btn-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
.resume{margin-top:22px;background:#F1F4F2;border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.resume p{margin:0;font-size:16px}

/* Prep */
.prep h2,.intro h2{font-weight:700;letter-spacing:-.025em;font-size:clamp(30px,4.6vw,42px);margin:22px 0 8px;text-align:center}
.prep .lead,.intro .lead{text-align:center;color:var(--soft);font-size:18px;margin:0 auto 6px;max-width:560px;line-height:1.5}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.checks li{display:flex;gap:16px;align-items:flex-start;font-size:17px;line-height:1.45}
.checks svg{flex:none;margin-top:2px}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}
.ov{border-radius:16px;padding:14px;background:#fff;border:1.5px solid var(--line)}
.ov b{display:block;font-size:16px}
.ov small{font-size:14px;color:var(--soft)}
.ov i{display:block;width:26px;height:6px;border-radius:9px;margin-bottom:10px}
.audiotest{margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#F1F4F2;border-radius:18px;padding:16px 18px}
.audiotest p{margin:0;font-size:16px;flex:1;min-width:200px}

/* Exam header */
.bar{position:sticky;top:0;z-index:5;background:var(--cream);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:16px}
.bar img{width:46px;height:auto}
.sections{display:flex;gap:6px;flex:1}
.sec{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.sec b{position:absolute;inset:0;width:0;border-radius:9px;transition:width .4s ease}
.clock{font-variant-numeric:tabular-nums;font-size:15px;color:var(--soft);min-width:52px;text-align:right}
.meta{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 14px;gap:12px}
.meta h3{margin:0;font-size:20px;font-weight:700}
.meta span{font-size:15px;color:var(--soft);font-variant-numeric:tabular-nums}

/* Question */
.qcard{background:var(--paper);border-radius:26px;padding:28px}
.prompt{font-size:22px;line-height:1.5;margin:0 0 22px;font-weight:500}
.prompt .gap{display:inline-block;min-width:84px;border-bottom:2px solid var(--teal);margin:0 4px;transform:translateY(-4px)}
.instr{font-size:15px;color:var(--soft);margin:0 0 10px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;font-size:19px;color:var(--ink);min-height:62px;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;background:var(--cream);color:var(--teal)}
.opt[aria-pressed="true"]{border-color:var(--teal);background:#F1F4F2}
.opt[aria-pressed="true"] .k{background:var(--teal);color:#fff}
.next{display:flex;justify-content:flex-end;margin-top:22px}

/* Reading split */
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.passage{background:#fff;border-radius:22px;padding:26px 28px;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:96px;border:1.5px solid var(--line)}
.passage h4{font-weight:700;letter-spacing:-.01em;font-size:24px;margin:0 0 14px;line-height:1.2}
.passage p{font-size:17.5px;line-height:1.7;margin:0 0 14px;max-width:62ch}
.passage .note{font-size:14px;color:var(--soft)}

/* Listening */
.player{display:flex;align-items:center;gap:20px;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:20px 22px;margin-bottom:18px}
.play{flex:none;width:72px;height:72px;border-radius:50%;border:0;background:var(--slate);display:grid;place-items:center}
.play:disabled{background:var(--line);cursor:not-allowed}
.play svg{width:28px;height:28px}
.player b{display:block;font-size:18px}
.player small{font-size:15px;color:var(--soft)}
.wave{display:flex;gap:4px;align-items:center;height:28px;margin-left:auto}
.wave i{width:4px;border-radius:4px;background:var(--slate);height:8px;opacity:.35}
.playing .wave i{opacity:1;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:8px}50%{height:26px}}

/* Intro */
.intro .badge{display:block;width:74px;height:74px;border-radius:24px;margin:26px auto 0;display:grid;place-items:center}
.intro .facts{display:flex;justify-content:center;gap:28px;margin-top:22px;flex-wrap:wrap}
.intro .facts div{text-align:center}
.intro .facts b{display:block;font-weight:700;font-size:36px;letter-spacing:-.02em;color:var(--teal)}
.intro .facts small{color:var(--soft);font-size:15px}

/* Results */
.result{text-align:center}
.result h2{font-weight:700;letter-spacing:-.025em;font-size:clamp(28px,4.4vw,40px);margin:24px 0 6px}
.result .who{color:var(--soft);font-size:18px;margin:0}
.levelbox{margin:26px auto 0;max-width:520px;background:var(--teal);color:#fff;border-radius:30px;padding:30px 26px}
.levelbox .lv{font-size:92px;line-height:1;font-weight:700;letter-spacing:-.03em}
.levelbox .ln{font-size:22px;font-weight:600;margin-top:8px}
.levelbox p{margin:12px auto 0;max-width:400px;font-size:16px;line-height:1.5;opacity:.9}
.secres{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.secres div{background:var(--paper);border-radius:18px;padding:16px 10px}
.secres small{display:block;font-size:14px;color:var(--soft)}
.secres b{display:block;font-weight:700;font-size:30px;margin-top:4px;color:var(--teal)}
.secres i{display:block;width:22px;height:5px;border-radius:9px;margin:0 auto 8px}
.coord{margin-top:20px;background:var(--paper);border-radius:20px;padding:18px 20px;text-align:left}
.coord h4{margin:0 0 10px;font-size:16px}
.coord table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.coord td{padding:7px 0;border-top:1px solid var(--line)}
.coord td:last-child{text-align:right;color:var(--soft)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

.modal{position:fixed;inset:0;background:rgba(46,68,70,.45);display:grid;place-items:center;padding:20px;z-index:30}
.modal div{background:var(--paper);border-radius:24px;padding:26px;max-width:420px;text-align:center}
.modal p{font-size:17px;line-height:1.5;margin:0 0 18px}

@media (max-width:760px){
  .stages{grid-template-columns:1fr}
  .stage{min-height:auto}
  .overview,.secres{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  .passage{position:static;max-height:none}
  .qcard{padding:22px}
  .prompt{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Results (approved design) */
.res{position:relative;overflow:hidden;background:#fff;border-radius:26px;padding:30px 24px 26px;text-align:center;max-width:520px;margin:6px auto 0;box-shadow:0 12px 34px rgba(31,46,58,.09);font-family:Poppins,var(--sans);color:#1F2E3A}
.res .dot{position:absolute;border-radius:50%;pointer-events:none}
.res img.wm{position:relative;width:170px;height:auto}
.res .kick{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.32em;color:#6B7A84;margin:20px 0 8px}
.res .stagepill{display:inline-block;font-family:var(--sans);font-size:14px;font-weight:600;color:#fff;background:linear-gradient(90deg,#E07A5F,#D9A441);border-radius:999px;padding:6px 16px;letter-spacing:.04em}
.res .name{font-size:clamp(24px,4.4vw,30px);font-weight:700;line-height:1.15;margin:18px 0 0}
.res .lvbox{background:#1F2E3A;color:#fff;border-radius:22px;padding:28px 20px;margin:22px 0 16px;position:relative;overflow:hidden}
.res .lvbox i{position:absolute;border-radius:50%}
.res .lvbox small{display:block;font-size:13px;letter-spacing:.24em;text-transform:uppercase;opacity:.8;position:relative}
.res .lvbox b{display:block;font-size:60px;line-height:1.1;margin:4px 0;font-weight:800;color:#F2C86B;position:relative}
.res .lvbox p{margin:0 auto;max-width:400px;font-size:15px;opacity:.92;position:relative;line-height:1.5}
.res .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res .sc{border-radius:16px;padding:13px 12px;background:#fff;border:1.5px solid;display:flex;align-items:center;justify-content:space-between}
.res .sc small{font-size:14px;font-weight:600}
.res .sc b{font-size:21px;font-weight:700;color:#fff;border-radius:10px;padding:2px 11px}
.res .dlbtn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:600 16px Poppins,var(--sans);margin-top:10px}
.res .dlbtn:disabled{opacity:.6}
.coord{max-width:520px;margin-left:auto;margin-right:auto}

.res .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.res .sc{gap:8px;min-width:0}
.res .sc .ttl,.res .sc small{min-width:0}
.res .sc b{flex:none}
@media (max-width:480px){
  .wrap{padding-left:14px;padding-right:14px}
  .res{padding:24px 16px 20px;border-radius:22px}
  .res .lvbox{padding:22px 14px}
  .res .sc{padding:11px 10px}
  .res .sc small{font-size:13px}
  .res .sc .q{display:none!important}
  .res .lvbox i:nth-of-type(4),.res .lvbox i:nth-of-type(5){display:none}
  .res .lvbox p{padding:0 6px}
  .res .sc b{font-size:18px;padding:2px 9px}
  .res .bigt{font-size:44px}
  .res .lvbox p{font-size:14px}
}
.prepcard .checks{margin-top:24px;text-align:left}
.prepcard .checks li{font-size:15px;line-height:1.5;gap:12px}
.prepcard .audiotest{text-align:left;background:#F6F7F8;margin-top:22px}
.prepcard .audiotest .play{background:#1F2E3A!important}
.prepcard .audiotest p{font-size:14.5px}
/* Welcome (same design as results) */
.res .hello{font-size:13px;letter-spacing:.24em;text-transform:uppercase;opacity:.8;position:relative;display:block}
.res .bigt{display:block;font-size:clamp(46px,9vw,62px);line-height:1.05;margin:6px 0 8px;font-weight:800;color:#F2C86B;position:relative;letter-spacing:-.02em}
.res .sc .q{display:block;font-size:12.5px;font-weight:500;color:#6B7A84;margin-top:1px}
.res .sc .ttl{text-align:left}
.res .meta2{font-size:14px;color:#6B7A84;margin:14px 0 0}
.res .fld{text-align:left;margin-top:24px}
.res .fld label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.res .fld input{width:100%;font:500 18px Poppins,var(--sans);padding:14px 16px;border:1.5px solid #DDE2E6;border-radius:14px;background:#fff;color:#1F2E3A}
.res .fld input:focus{border-color:#1F2E3A;outline:none}
.res .stg{display:grid;gap:8px}
.res .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid #E6E9EC;border-radius:14px;padding:12px 14px;font-family:Poppins,var(--sans);color:#1F2E3A}
.res .opt strong{display:block;font-size:15px;font-weight:600}
.res .opt span{font-size:12.5px;color:#6B7A84}
.res .opt em{font-style:normal;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:#F3F1EC;color:#6B7A84;white-space:nowrap}
.res .opt[aria-pressed="true"]{border-color:#1F2E3A;box-shadow:inset 0 0 0 1px #1F2E3A}
.res .opt[aria-pressed="true"] em{background:linear-gradient(90deg,#E07A5F,#D9A441);color:#fff}
.res .opt:disabled{opacity:.55;cursor:not-allowed}

/* Exam screens (same design as welcome/results) */
.bar{background:rgba(227,223,211,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:0;padding:12px 0}
.bar-in{max-width:760px;background:#fff;border-radius:999px;padding:10px 20px 10px 14px;box-shadow:0 6px 20px rgba(31,46,58,.07);margin:0 auto;width:calc(100% - 28px)}
.bar img{width:40px}
.sec{height:9px;background:#EEF0F1}
.sec.cur{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #DDE2E6}
.clock{font-family:Poppins,var(--sans);font-weight:600;font-size:14px;color:#1F2E3A;background:#F3F1EC;border-radius:999px;padding:5px 12px;min-width:auto}
.secintro{margin-top:10px}
.secintro .kick{margin-top:6px;position:relative}
.sbadge{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:8px auto 0;box-shadow:0 10px 24px rgba(31,46,58,.12)}
.stitle{position:relative;font-family:Poppins,var(--sans);font-weight:800;font-size:clamp(34px,7vw,44px);letter-spacing:-.02em;margin:18px 0 0;color:#1F2E3A;line-height:1.1}
.ses{position:relative;margin:4px 0 0;font-size:15px;font-weight:500;color:#6B7A84}
.lead2{position:relative;font-size:15px!important;line-height:1.55;max-width:400px;margin:14px auto 0!important}
.secintro .facts{position:relative;display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.secintro .fact{flex:1;min-width:92px;max-width:140px;border:1.5px solid;border-radius:16px;padding:12px 8px}
.secintro .fact b{display:block;font-size:28px;font-weight:800;line-height:1.1;color:#1F2E3A}
.secintro .fact small{font-size:12.5px;color:#6B7A84;font-weight:500}
.steps{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:20px}
.steps span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 12px;background:#F3F1EC;color:#9AA4AB}
.steps span.now{background:var(--c);color:#fff}
.steps span.ok{background:var(--b);color:#1F2E3A}
.steps span.ok svg{stroke:#1F2E3A}
.qwrap{max-width:760px;padding-top:10px;font-family:Poppins,var(--sans);color:#1F2E3A}
.qwrap .qcard{background:#fff;border-radius:26px;padding:24px 24px 22px;box-shadow:0 12px 34px rgba(31,46,58,.09);position:relative}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.qhead .chip{font-size:13px;font-weight:600;color:#fff;border-radius:999px;padding:6px 14px;letter-spacing:.02em}
.qhead .qn{font-size:13px;font-weight:600;color:#6B7A84;background:#F3F1EC;border-radius:999px;padding:6px 12px}
.qwrap .instr{font-family:var(--sans);font-size:14px;color:#6B7A84;margin:0 0 8px}
.qwrap .prompt{font-size:21px;font-weight:600;line-height:1.45;color:#1F2E3A}
.qwrap .prompt .gap{border-bottom:2.5px solid var(--c);min-width:90px}
.qwrap .opt{border:1.5px solid #E6E9EC;border-radius:16px;font-family:Poppins,var(--sans);font-size:17px;font-weight:500;color:#1F2E3A;padding:13px 16px;min-height:58px}
.qwrap .opt .k{background:#F3F1EC;color:#1F2E3A;font-weight:600;width:32px;height:32px;font-size:14px}
.qwrap .opt[aria-pressed="true"]{border-color:#1F2E3A;background:#fff;box-shadow:inset 0 0 0 1px #1F2E3A}
.qwrap .opt[aria-pressed="true"] .k{background:var(--c);color:#fff}
.qwrap .next{display:block;margin-top:18px}
.dlbtn.nx{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:600 16px Poppins,var(--sans);background:#1F2E3A;color:#fff}
.dlbtn.nx:disabled{opacity:.3;cursor:not-allowed}
.qwrap .passage{border:0;border-radius:26px;box-shadow:0 12px 34px rgba(31,46,58,.09);padding:24px 26px;top:92px}
.qwrap .passage .ptag{display:block;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#6B7A84;margin-bottom:6px}
.qwrap .passage h4{font-family:Poppins,var(--sans);font-weight:700;font-size:22px;color:#1F2E3A;padding-bottom:12px;border-bottom:3px solid var(--c);display:inline-block}
.qwrap .passage p{font-family:var(--sans);font-size:17px;line-height:1.7;color:#2E3D48}
.qwrap .player{border:0;border-radius:26px;box-shadow:0 12px 34px rgba(31,46,58,.09);padding:18px 22px}
.qwrap .play{background:var(--c);box-shadow:0 8px 18px rgba(31,46,58,.15)}
.qwrap .player b{font-weight:700;font-size:17px}
.qwrap .player small{font-family:var(--sans);font-size:14px;color:#6B7A84}
.qwrap .wave i{background:var(--c)}
.prepcard .audiotest .play.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,46,58,.25)}50%{box-shadow:0 0 0 12px rgba(31,46,58,0)}}
@media (max-width:480px){
  .steps{flex-wrap:nowrap;gap:4px}
  .steps span{font-size:11px;padding:4px 8px;gap:3px}
  .qwrap .play{width:60px;height:60px}
  .qwrap .player{gap:14px;padding:16px}
  .qwrap .wave{display:none}
  .bar-in{padding:8px 14px 8px 10px;gap:10px}
  .bar img{width:32px}
  .qwrap .qcard{padding:20px 16px 18px;border-radius:22px}
  .qwrap .prompt{font-size:19px}
  .qwrap .opt{font-size:16px}
  .qwrap .passage{padding:20px 18px;border-radius:22px}
}
.opts.pics{grid-template-columns:repeat(3,1fr);gap:10px}
.qwrap .opt.pic,.example .opt.pic{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:8px;min-height:0;position:relative;gap:0}
.opt.pic img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:10px;background:#FBF7EE}
.opt.pic .k{position:absolute;top:8px;left:8px;z-index:1}
.bigword{font-family:Poppins,var(--sans);font-size:46px;font-weight:800;text-align:center;margin:6px 0 18px;color:#1F2E3A;letter-spacing:.5px}
.scene img{display:block;width:100%;max-width:440px;margin:4px auto 16px;border-radius:16px;aspect-ratio:4/3;object-fit:cover}
.passage .pimg{display:block;width:100%;border-radius:14px;margin:4px 0 14px;aspect-ratio:4/3;object-fit:cover}
.ines{font-size:13.5px;color:#7A8590;font-weight:500}
.kids .passage p{font-size:18px;line-height:1.6}
.kids .prompt{font-size:21px}
.example{position:relative;z-index:1;margin:18px auto 4px;max-width:460px;text-align:left;border:2px dashed #D6DCE0;border-radius:18px;padding:14px 14px 10px;background:#FBFAF7}
.example .extag{display:inline-block;background:#1F2E3A;color:#fff;font:700 11px Poppins,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-radius:99px;padding:4px 10px}
.example .exins{font-size:14px;color:#4A5763;margin:8px 0 10px}
.example .opts{pointer-events:none}
.example .opt{justify-content:flex-start;text-align:left;font-family:Poppins,var(--sans);font-size:15px;padding:10px 12px;min-height:0;border:1.5px solid #E6E9EC;border-radius:14px}
.example .opt[aria-pressed="true"]{border-color:var(--c,#8DB596);background:#F1F7F2}
.example .bigword{font-size:34px;margin:2px 0 10px}
.example .scene img{max-width:300px;margin-bottom:10px}
.example .exnote{font-size:12.5px;color:#7A8590;margin:8px 0 0;text-align:center}

@media (max-width:520px){.bigword{font-size:38px}.opts.pics{gap:7px}}
</style>
</head>

"Many parents think their teenage children are lazy because they stay up late and find it hard to wake up in the morning. However, scientists say the real reason is biological. During adolescence, the body starts producing melatonin, the hormone that makes us feel sleepy, about two hours later than in children or adults. This means that a typical teenager doesn’t feel tired until around 11 p.m. or even midnight.",

{lvl:4,title:"The Hidden Costs of Working from Home",paras:[
"When offices closed in 2020, millions of employees discovered that they could do their jobs from the kitchen table. Years later, remote and hybrid work have become permanent features of many industries, and surveys consistently show that workers value the flexibility. Without a daily commute, people save time and money, and many report a better balance between their professional and personal lives.",
"Yet the picture is not entirely positive. Researchers have found that remote employees often work longer hours, partly because the boundary between “office” and “home” becomes blurred. Checking emails late at night can easily become a habit. Others mention a sense of isolation: casual conversations with colleagues, which once happened naturally by the coffee machine, have largely disappeared, and with them an important source of informal learning and support.",
"Managers face challenges too. Some worry that it is harder to evaluate performance when they cannot see their team, although critics argue that this reflects outdated management styles rather than a real problem. Junior employees may be the most affected, since they traditionally learn by observing more experienced colleagues.",
"Most experts now recommend a balanced approach: allowing flexibility while creating regular opportunities for teams to meet in person."],

{lvl:5,title:"In Praise of Boredom",paras:[
"For most of human history, boredom was an unavoidable part of daily life: waiting for a bus, standing in a queue or sitting through a long evening with nothing in particular to do. Today, such moments have all but vanished. The smartphone in our pocket ensures that every idle second can be filled instantly with news, messages or an endless stream of videos. At first glance, this seems like an unambiguous improvement. Who would choose tedium over entertainment?",
"A growing body of research, however, suggests that we may have underestimated what boredom does for us. In one frequently cited study, participants who were first given a deliberately dull task, copying numbers from a telephone directory, subsequently produced more creative ideas than those who had not. The researchers concluded that boredom prompts the mind to wander, and that this wandering is precisely where unexpected connections are made.",
"None of this means that we should romanticize monotony. Chronic boredom has been linked to anxiety and poor decision-making, and few people would argue that a tedious job is good for the soul. The point, rather, is that occasional, low-stakes boredom serves a purpose. By reflexively eliminating it, we may be depriving ourselves of the mental space in which reflection and imagination flourish.",
"Perhaps the solution is not to abandon our devices but to use them more deliberately: to leave the phone in another room now and then, and to tolerate, even welcome, a few minutes of doing nothing at all."],

["What does the author recommend?",["Using our devices more deliberately","Getting rid of our phones completely","Looking for more tedious jobs","Doing creativity tests regularly"]]]},

{lvl:3,title:"The Rise of Urban Gardens",paras:["In many cities around the world, people are turning rooftops, empty lots and even balconies into small gardens. Some grow vegetables to save money, while others simply enjoy spending time outdoors after a long day at work.","Urban gardens have benefits beyond the food they produce. Plants help cool down buildings in summer and absorb rainwater, which reduces flooding. Community gardens also bring neighbors together: people who had never spoken before now share tools, seeds and advice.","However, urban gardening is not always easy. Space is limited, and in some areas the soil is polluted, so gardeners have to use raised beds with clean soil. Water can also be expensive. Even so, supporters argue that the benefits are worth the effort, and many local governments now offer free workshops to help people get started."],qs:[["According to the text, why do some people start urban gardens?",["To save money or enjoy being outdoors","Because they must by law","To sell vegetables to restaurants","Because they can’t find work"]],["How do plants help buildings?",["They keep them cooler in summer","They make them stronger","They make them cheaper to build","They protect them from noise"]],["What social benefit of community gardens is mentioned?",["Neighbors get to know each other","Children learn math","People pay less rent","Crime disappears completely"]],["Why do some gardeners use raised beds?",["Because the soil may be polluted","Because they look nicer","Because they need less sun","Because water is free"]],["How are some local governments helping?",["By offering free workshops","By giving away land","By paying for water","By building rooftops"]]]},
{lvl:3,title:"A Lesson from My Grandfather",paras:["When I was twelve, I spent a summer with my grandfather, who repaired old clocks in a small shop. At first, I found it boring. The shop was quiet, and he worked so slowly that I wondered how he ever finished anything.","One afternoon, he gave me a broken clock and told me to fix it. I opened it, took everything apart in ten minutes, and then had no idea how to put it back together. I felt embarrassed, but he just laughed and said, “Now you know why I’m slow.”","For the rest of the summer, he taught me to draw each piece before removing it and to work in order. By August, I had repaired my first clock. I never became a clockmaker, but I still use his method whenever I face a complicated problem."],qs:[["How did the writer feel at the beginning of the summer?",["Bored","Excited","Scared","Proud"]],["What happened when the writer tried to fix the clock?",["They couldn’t put it back together","They fixed it in ten minutes","They lost some pieces","They broke their grandfather’s tools"]],["How did the grandfather react?",["He laughed and explained why he worked slowly","He got angry","He fixed it himself immediately","He sent the writer home"]],["What method did the grandfather teach?",["Drawing each piece and working in order","Working as fast as possible","Reading the instructions first","Asking a customer for help"]],["What is the main idea of the story?",["A patient method can help with complex problems","Clockmaking is a boring job","Children shouldn’t work in shops","Grandparents are always right"]]]},
{lvl:4,title:"Can Social Media Make Us Lonely?",paras:["Social media platforms promise to keep us connected, and in many ways they do. We can follow the lives of friends who live on the other side of the world and join communities of people who share our interests. Yet a growing number of studies suggest that heavy users often report feeling lonelier, not less.","Researchers believe the explanation lies partly in how we use these platforms. Passively scrolling through other people’s carefully edited photos tends to encourage comparison, which can leave us feeling that our own lives are dull. Active use, such as sending messages or arranging to meet, appears to have the opposite effect.","Another factor is time. Hours spent online may replace face-to-face interaction, which offers things a screen cannot, such as physical presence and shared experiences. The conclusion, then, is not that social media is harmful in itself, but that it works best as a bridge to real-world relationships rather than a substitute for them."],qs:[["What contradiction does the first paragraph point out?",["Platforms promise connection, but heavy users may feel lonelier","People use social media less than they say","Friends abroad prefer letters","Online communities are getting smaller"]],["Why can passive scrolling be harmful?",["It encourages people to compare their lives with others’","It uses too much battery","It shows too many advertisements","It takes away privacy"]],["Which type of use appears to have a positive effect?",["Sending messages and arranging meetings","Watching videos","Reading the news","Posting edited photos"]],["What can face-to-face interaction offer that screens can’t?",["Physical presence and shared experiences","Faster communication","More friends","Better photos"]],["What is the writer’s conclusion?",["Social media is most useful as a bridge to real relationships","Social media should be banned","People should delete their accounts","Online friendships are more valuable"]]]},
{lvl:4,title:"The Four-Day Week Experiment",paras:["In recent years, several companies have tested a four-day working week, in which employees work fewer hours but receive the same salary. The idea sounds almost too good to be true, so what have these experiments actually shown?","In many trials, productivity stayed the same or even increased. Employees reported less stress and fewer sick days, and companies found it easier to attract and keep talented staff. Managers noted that meetings became shorter and more focused, as teams looked for ways to save time.","Not every sector benefits equally, however. Hospitals, schools and shops need people present every day, so reducing hours there often means hiring more staff, which increases costs. Critics also warn that squeezing five days of work into four can make some days exhausting. For now, the four-day week seems to work best in office-based jobs where results matter more than hours."],qs:[["What is special about the four-day week in these trials?",["Fewer hours with the same salary","Longer days with more pay","Fewer hours with lower pay","Working from home every day"]],["What happened to productivity in many trials?",["It stayed the same or increased","It fell sharply","It was impossible to measure","It improved only for managers"]],["How did meetings change?",["They became shorter and more focused","They were canceled","They became longer","They moved online"]],["Why is the model harder for hospitals and schools?",["They need people present every day","Their staff don’t want it","They already work four days","They have too many employees"]],["What concern do critics raise?",["Some days can become exhausting","Salaries will go down","People will lose their jobs","Companies will close"]]]},
{lvl:5,title:"The Paradox of Choice",paras:["Conventional wisdom holds that more choice is always better: the more options we have, the more likely we are to find exactly what we want. Yet psychologists have observed that an abundance of options can be paralyzing. In one well-known experiment, shoppers who were offered twenty-four varieties of jam were far less likely to buy any than those offered only six.","The problem is not merely the effort of comparing options. When choices multiply, so do our expectations, and so does the likelihood of regret. Having picked one item from dozens, we are left wondering whether one of the alternatives might have been better, which diminishes our satisfaction with the decision we actually made.","None of this implies that choice is undesirable; few of us would willingly return to a world with a single brand of everything. Rather, the lesson is that beyond a certain point, additional options cease to add value. Some researchers suggest adopting a deliberate strategy: deciding in advance what is “good enough” and stopping the search once that standard has been met."],qs:[["What does the jam experiment illustrate?",["Too many options can discourage people from choosing","People prefer expensive products","Shoppers enjoy comparing options","Six varieties are too few"]],["According to the second paragraph, why do more options reduce satisfaction?",["They raise expectations and make regret more likely","They make products more expensive","They take too much time to compare","They confuse sellers"]],["What is the writer’s position on choice?",["It is valuable, but only up to a point","It should be eliminated","It always leads to regret","It matters only for food"]],["What strategy do some researchers suggest?",["Deciding beforehand what is “good enough”","Always choosing the cheapest option","Asking others to decide","Comparing every option carefully"]],["The word “cease” in the last paragraph is closest in meaning to:",["stop","begin","continue","pretend"]]]},
{lvl:5,title:"What We Lose When Languages Die",paras:["Linguists estimate that roughly half of the world’s seven thousand languages may disappear by the end of this century. Most are spoken by small communities, and when the last fluent speakers die, the language often goes with them, sometimes without ever having been recorded.","It is tempting to regard this as an inevitable consequence of globalization, perhaps even a convenient one: fewer languages, after all, might make communication easier. But each language encodes a particular way of seeing the world. Some contain detailed knowledge of local plants and their medicinal uses; others distinguish concepts that have no equivalent elsewhere. When a language vanishes, that knowledge is frequently lost as well.","Encouragingly, revitalization efforts have shown that decline is not always irreversible. Hebrew was revived as an everyday spoken language, and communities from Wales to New Zealand have expanded the use of their languages through schools and media. Such successes, however, depend on something no outside expert can provide: the determination of the speakers themselves."],qs:[["What do linguists predict?",["About half of the world’s languages may disappear this century","All small languages will be recorded","Seven thousand new languages will appear","Globalization will slow down"]],["What view does the writer challenge in the second paragraph?",["That language loss is unimportant or even convenient","That globalization exists","That languages contain knowledge","That communication is important"]],["Why is losing a language a loss of knowledge?",["Languages encode unique knowledge and ways of seeing the world","Dictionaries become more expensive","Fewer people can travel","Schools stop teaching history"]],["What do the examples of Hebrew and Wales show?",["Language decline can sometimes be reversed","Only large languages survive","Media harms small languages","Experts can save any language"]],["According to the writer, what is essential for revitalization to succeed?",["The determination of the speakers","Government money","Outside experts","International organizations"]]]}

{lvl:5,id:"tya-listening-14",title:"A podcast about sleep",lines:[["M","Most of us treat sleep as something we can cut back on when life gets busy, as if it were a luxury rather than a biological necessity. Yet the research suggests otherwise. When we sleep, the brain isn’t simply switching off; it’s consolidating memories, clearing out waste and regulating our emotions. People who regularly sleep less than six hours are not only more forgetful; they’re also more irritable and more likely to make risky decisions. What’s striking is that they often don’t realize how impaired they are. In one study, participants who had slept poorly for two weeks rated themselves as only slightly tired, while their performance had dropped to the level of someone who hadn’t slept at all for a night. So perhaps the question isn’t whether we can afford to sleep more, but whether we can afford not to."]],qs:[["What attitude toward sleep does the speaker criticize?",["Treating it as a luxury we can reduce","Sleeping too much at weekends","Taking naps during the day","Using sleeping pills"]],["What was surprising about the study?",["Participants didn’t realize how impaired they were","Participants slept more than expected","Participants performed better after two weeks","Participants felt extremely tired"]],["What is the speaker’s conclusion?",["Not sleeping enough has a cost we can’t ignore","Sleep is less important than we think","Most people sleep too much","Only students need more sleep"]]]},

{lvl:4,title:"The Girl Who Cleaned a Beach",paras:[
"When twelve-year-old Ximena visited her favorite beach in Veracruz after a storm, she was shocked. The sand was covered with bottles, bags and pieces of fishing net. A small bird was trapped in one of the nets, and Ximena and her father carefully freed it.",
"That evening, she made a decision. She posted a message on her school’s community page inviting anyone who wanted to help to meet at the beach the following Saturday. She expected maybe ten people. More than eighty showed up.",
"The group collected over 600 kilograms of trash in one morning. But Ximena didn’t want it to be a one-time event. She convinced a local restaurant to give free drinks to volunteers, and she started organizing clean-ups on the first Saturday of every month.",
"Two years later, the project has spread to four other beaches. When journalists ask Ximena what she has learned, she always gives the same answer: “You don’t need to be an adult to start something important. You just need to start.”"],
qs:[
["What made Ximena decide to act?",["Seeing the beach covered in trash after a storm","A school assignment","A TV documentary","Her father’s job"]],
["How many people did Ximena expect at the first clean-up?",["About ten","More than eighty","Around six hundred","Only her family"]],
["Why did Ximena talk to a local restaurant?",["To give volunteers a reward","To ask for money","To complain about the trash","To find a place to meet"]],
["What does “the project has spread” mean?",["It now happens in more places","It has finished","It became more expensive","It moved to another city"]],
["What is the main message of Ximena’s answer to journalists?",["Young people can start important things","Adults should clean beaches","Starting a project is very difficult","You need a lot of money to help"]]]},

{lvl:4,title:"Should Phones Be Allowed at School?",paras:[
"In many countries, schools are debating whether students should be allowed to bring phones to class. Some schools have banned them completely, while others let students use them for specific activities.",
"Those who support a ban argue that phones are a major distraction. Studies in several countries have found that students’ test results sometimes improve after phones are removed from classrooms. Supporters also say that without phones, students talk to each other more during breaks and are less exposed to online bullying during the school day.",
"On the other hand, many students and some teachers believe that phones can be useful learning tools. They can be used to look up information, record science experiments or practice languages with apps. Some parents also want their children to have a phone in case of an emergency.",
"Perhaps the best solution lies somewhere in the middle: clear rules about when phones can be used, and teaching students to manage their own screen time responsibly."],
qs:[
["What is the main topic of the text?",["Whether phones should be allowed at school","How to buy a good phone","The history of mobile phones","Online games"]],
["According to the text, what sometimes happens when phones are removed?",["Test results improve","Students feel more stressed","Bullying increases","Students stop talking"]],
["Which is an argument in favor of phones at school?",["They can be used as learning tools","They help students sleep","They make breaks shorter","They are cheaper than books"]],
["Why do some parents want their children to have phones?",["In case of an emergency","To play during class","To check grades","To take photos of teachers"]],
["What does the writer suggest at the end?",["Clear rules and responsible use","A total ban everywhere","No rules at all","Letting parents decide everything"]]]},

{lvl:5,title:"Teenagers and Sleep",paras:[
"Parents often complain that teenagers stay up late and are impossible to wake in the morning. While it is tempting to blame video games or social media, research suggests there is a deeper, biological explanation.",
"During adolescence, the body’s internal clock — known as the circadian rhythm — shifts. The brain begins to release melatonin, the hormone that makes us feel sleepy, roughly two hours later than it did in childhood. As a result, many teenagers genuinely do not feel tired until eleven o’clock at night or later, even if they are exhausted.",
"This shift collides with early school schedules. Since adolescents still need around nine hours of sleep, a student who falls asleep at midnight and wakes at six is chronically sleep-deprived. Lack of sleep has been linked to poorer concentration, irritability and even a weakened immune system.",
"Some school districts have responded by delaying the start of classes. Early results are encouraging: attendance has risen, and students report feeling more alert. Critics, however, point out that later start times can complicate transportation and after-school activities, so the debate is far from settled."],
qs:[
["What is the main idea of the second paragraph?",["Teenagers’ internal clocks change, making them sleepy later","Teenagers are lazy","Melatonin keeps teenagers awake","Children need less sleep than teenagers"]],
["The word “collides” in paragraph 3 suggests that…",["teen sleep patterns and school times conflict","teenagers like early classes","schools start too late","buses are often late"]],
["How much sleep do adolescents still need, according to the text?",["Around nine hours","Around six hours","Around eleven hours","Around two hours"]],
["What has happened in schools that delayed classes?",["Attendance has risen and students feel more alert","Students sleep even later","Grades have fallen","After-school activities became easier"]],
["What is the writer’s attitude toward the debate?",["It is not yet resolved","Schools should never change","Critics are completely wrong","The problem has been solved"]]]}
];

  STG=STAGES[id]||STAGES.tya; SECTIONS=STG.sections; STAGE_NAME=STG.name; DESC_TXT=STG.desc;
  TOTAL_Q=SECTIONS.reduce((s,x)=>s+(x.type==="item"?x.n:x.sets*x.per),0);
}

function rng(n){return Array.from({length:n},(_,i)=>i)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200)}

/* ============ Adaptive engine ============ */
function secState(sec){
  if(!S.secs[sec.id]){
    /* Later sections start at the level shown so far (routing), so short sections can still reach the top levels */
    let start=STG.start||2;
    const prev=SECTIONS.slice(0,SECTIONS.indexOf(sec)).filter(x=>S.secs[x.id]&&S.secs[x.id].answers.length);
    if(prev.length) start=Math.round(prev.reduce((t,x)=>t+ability(x),0)/prev.length);
    start=Math.max(1,Math.min(STG.top||5,start));
    S.secs[sec.id]={level:start,used:[],answers:[],setResults:[]};
  }
  return S.secs[sec.id];
}
const SEEN_KEY="sh_levelup_seen";
function seenList(sid){try{const m=JSON.parse(localStorage.getItem(SEEN_KEY))||{};return m[S.stage+"/"+sid]||[]}catch(e){return []}}
function markSeen(sid,idx){try{const m=JSON.parse(localStorage.getItem(SEEN_KEY))||{};const k=S.stage+"/"+sid;const l=(m[k]||[]).filter(x=>x!==idx);l.push(idx);m[k]=l.slice(-60);localStorage.setItem(SEEN_KEY,JSON.stringify(m))}catch(e){}}
function pickIndex(bank,used,level,dir,sid){
  const seen=sid?seenList(sid):[];
  const order=[level];
  for(let d=1;d<5;d++){ const a=level+(dir>=0?d:-d), b=level+(dir>=0?-d:d); order.push(a,b); }
  for(const l of order){
    if(l<1||l>5) continue;
    const pool=bank.map((x,i)=>i).filter(i=>!used.includes(i)&&(bank[i][0]===l||bank[i].lvl===l));
    if(pool.length){const fresh=pool.filter(i=>!seen.includes(i));const P=fresh.length?fresh:pool;return P[Math.floor(Math.random()*P.length)]}
  }
  return -1;
}
function serveNext(){
  const sec=SECTIONS[S.sectionIdx], st=secState(sec);
  if(sec.type==="item"){
    const last=st.answers[st.answers.length-1];
    const idx=pickIndex(sec.bank,st.used,st.level,last?(last.ok?1:-1):0,sec.id);
    st.used.push(idx);markSeen(sec.id,idx);
    const it=sec.bank[idx];S.cur={idx,order:shuffle(rng((it.opts||it[2]).length)),choice:null};
  }else{
    const last=st.setResults[st.setResults.length-1];
    const idx=pickIndex(sec.bank,st.used,st.level,last?(last.r>=.6?1:-1):0,sec.id);
    st.used.push(idx);markSeen(sec.id,idx);
    const n=sec.bank[idx].qs.length;
    S.cur={idx,qi:0,orders:sec.bank[idx].qs.map(q=>shuffle(rng(q[1].length))),choice:null,correct:0,plays:0};
  }
  S.phase="q";save();render();
}
function answer(){
  const sec=SECTIONS[S.sectionIdx], st=secState(sec), c=S.cur;
  if(c.choice===null) return;
  if(sec.type==="item"){
    const item=sec.bank[c.idx], ok=c.order[c.choice]===0;
    st.answers.push({lvl:item.lvl??item[0],ok,g:1/(item.opts||item[2]).length});
    st.level=Math.max(1,Math.min(STG.top||5,st.level+(ok?1:-1)));
    if(st.answers.length>=sec.n) return finishSection();
    serveNext();
  }else{
    const set=sec.bank[c.idx], ok=c.orders[c.qi][c.choice]===0;
    st.answers.push({lvl:set.lvl,ok,g:1/set.qs[c.qi][1].length});
    if(ok) c.correct++;
    c.qi++;c.choice=null;
    if(c.qi<set.qs.length){save();keepAudio=playing;render();return}
    stopAudio();
    const r=c.correct/set.qs.length;
    st.setResults.push({lvl:set.lvl,r});
    st.level=Math.max(1,Math.min(STG.top||5,st.level+(r>=.6?1:r<=.4?-1:0)));
    if(st.setResults.length>=sec.sets) return finishSection();
    serveNext();
  }
}
function finishSection(){
  S.cur=null;
  if(S.sectionIdx<SECTIONS.length-1){S.sectionIdx++;S.phase="intro"}
  else{S.phase="done";S.ended=Date.now()}
  save();render();window.scrollTo(0,0);
}
function ability(sec){
  /* Maximum-likelihood estimate with guessing (4 options): robust at both ends of the scale */
  const st=S.secs[sec.id]; if(!st||!st.answers.length) return 0;
  const a=st.answers; let best=0,bestLL=-1e9;
  for(let th=-0.5;th<=6.5;th+=0.05){
    let ll=0;
    for(const x of a){
      const g=x.g||.25,p=g+(1-g)/(1+Math.exp(-2.2*(th-x.lvl)));
      ll+=Math.log(x.ok?p:1-p);
    }
    if(ll>bestLL){bestLL=ll;best=th}
  }
  /* Never estimate beyond the levels actually seen (avoids runaway scores with few items) */
  const lv=a.map(x=>x.lvl), hi=Math.max(...lv)+.5, lo=Math.min(...lv)-.5;
  best=Math.max(lo,Math.min(hi,best));
  return Math.max(0,Math.min(6,best));
}
const WEIGHTS={vocab:.25,grammar:.30,reading:.25,listening:.20};
function results(){
  const per=SECTIONS.map(sec=>{
    const st=S.secs[sec.id]||{answers:[]};
    const a=Math.max(0,ability(sec)-(STG.offset||0));
    return {sec,a,lv:levelOf(a),ok:st.answers.filter(x=>x.ok).length,n:st.answers.length};
  });
  const overall=per.reduce((s,p)=>s+p.a*WEIGHTS[p.sec.id],0);
  per.forEach(p=>{p.lv=Math.min(p.lv,STG.maxLv)});
  return {per,overall,lv:Math.min(levelOf(overall),STG.maxLv)};
}

/* ============ Audio (MP3 if present, device voice otherwise) ============ */
let voices=[];
function loadVoices(){voices=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^en(-|_)/i.test(v.lang))}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(g){
  const fem=/samantha|aria|jenny|zira|karen|victoria|female|susan|serena|allison|ava|google us english/i;
  const mal=/daniel|alex|guy|david|fred|male|tom|aaron|google uk english male|arthur/i;
  const us=voices.filter(v=>/en.US/i.test(v.lang));
  const list=us.length?us:voices;
  const rx=g==="M"?mal:fem;
  return list.find(v=>rx.test(v.name))||voices.find(v=>rx.test(v.name))||list[g==="M"?Math.min(1,list.length-1):0]||null;
}
let mp3=null, playing=false;
function stopAudio(){playing=false;if(mp3){mp3.pause();mp3=null}if(window.speechSynthesis)speechSynthesis.cancel()}
function speakLines(lines,done,rate){
  if(!window.speechSynthesis){done();return}
  speechSynthesis.cancel();
  let i=0;
  const next=()=>{
    if(!playing) return;
    if(i>=lines.length){done();return}
    const [who,text]=lines[i++];
    const u=new SpeechSynthesisUtterance(text.replace(/[‘’]/g,"'"));
    const v=pickVoice(who); if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";
    u.rate=rate||.95; u.pitch=who==="M"?.9:1.05;
    u.onend=()=>setTimeout(next,350); u.onerror=()=>setTimeout(next,200);
    speechSynthesis.speak(u);
  };
  next();
}
function playSet(set,onEnd){
  playing=true;
  const rate=set.lvl<=2?.88:.95;
  const fallback=()=>speakLines(set.lines,onEnd,rate);
  if(!set.id){fallback();return}
  /* 1) One MP3 per audio: audios/<id>.mp3 (ElevenLabs, already joined).
     2) If missing, one MP3 per line: audios/<id>-01.mp3, -02.mp3 ...
     3) If missing, device voice. */
  const pad=n=>String(n).padStart(2,"0");
  const perLine=()=>{
    let i=0;
    const next=()=>{
      if(!playing) return;
      if(i>=set.lines.length){mp3=null;onEnd();return}
      const first=i===0;
      mp3=new Audio(set.id+"-"+pad(i+1)+".mp3");i++;
      let started=false;
      mp3.onplaying=()=>{started=true};
      mp3.onended=()=>setTimeout(next,450);
      const fail=()=>{mp3=null;if(!playing)return;if(first&&!started)fallback();else setTimeout(next,200)};
      mp3.onerror=fail;
      mp3.play().catch(()=>{if(!started)fail()});
    };
    next();
  };
  mp3=new Audio(set.id+".mp3");
  let started=false;
  mp3.onplaying=()=>{started=true};
  mp3.onended=()=>{mp3=null;onEnd()};
  const fail=()=>{mp3=null;if(!playing||started)return;perLine()};
  mp3.onerror=fail;
  mp3.play().catch(()=>{if(!started)fail()});
}

let keepAudio=false;
function render(){
  if(!keepAudio) stopAudio();
  keepAudio=false;
  if(S.stage==="yl"&&!window.YL_IMG&&S.phase!=="welcome"&&S.phase!=="done"){app.innerHTML=`<div class="wrap"><p class="meta2" style="text-align:center;margin-top:60px">Cargando dibujos…</p></div>`;loadYL(render);return}
  if(S.phase==="welcome") return vWelcome();
  if(S.phase==="prep") return vPrep();
  if(S.phase==="intro") return vIntro();
  if(S.phase==="q") return vQuestion();
  if(S.phase==="done") return vDone();

function header(){
  const done=SECTIONS.map((x,i)=>{
    if(i<S.sectionIdx) return 1;
    if(i>S.sectionIdx) return 0;
    const st=S.secs[x.id]; const n=x.type==="item"?x.n:x.sets*x.per;
    return st?st.answers.length/n:0;
  });
  return `<div class="bar"><div class="bar-in">
    <img src="${PLANT}" alt="">
    <div class="sections">${SECTIONS.map((x,i)=>`<div class="sec${i===S.sectionIdx?" cur":""}" title="${x.name}"><b style="background:${SEC_STYLE[x.id].c};width:${done[i]*100}%"></b></div>`).join("")}</div>
    <div class="clock" id="clock"></div>
  </div></div>`;
}
let clockT=null;
function tickClock(){
  clearInterval(clockT);
  const f=()=>{const el=$("#clock");if(!el||!S.started)return;const s=Math.floor((Date.now()-S.started)/1000);el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
  f();clockT=setInterval(f,1000);
}

function optionsHTML(texts,order,choice){
  return `<div class="opts">${order.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="${choice===i}"><span class="k">${"ABCD"[i]}</span><span>${esc(texts[o])}</span></button>`).join("")}</div>`;
}
function YLI(n){return (window.YL_IMG&&YL_IMG[n])||""}
function loadYL(cb){
  if(window.YL_IMG){cb&&cb();return}
  if(loadYL.q){if(cb)loadYL.q.push(cb);return}
  loadYL.q=cb?[cb]:[];
  const sc=document.createElement("script");sc.src="yl-img.js";
  sc.onload=()=>{const q=loadYL.q;loadYL.q=null;q.forEach(f=>f())};
  sc.onerror=()=>{loadYL.q=null;sc.remove();toast("No se pudieron cargar los dibujos. Revisa la conexión.")};
  document.head.appendChild(sc);
}
function picOptsHTML(names,order,choice){
  return `<div class="opts pics">${order.map((o,i)=>`<button class="opt pic" data-i="${i}" aria-pressed="${choice===i}"><span class="k">${"ABCD"[i]}</span><img src="${YLI(names[o])}" alt="Opción ${"ABCD"[i]}"></button>`).join("")}</div>`;
}
const YL_INS={word:["Read the word. Choose the right picture.","Lee la palabra y elige el dibujo correcto."],def:["Read and choose the right picture.","Lee la oración y elige el dibujo correcto."],look:["Look at the picture. Choose the right sentence.","Mira el dibujo y elige la oración correcta."],txt:["Choose the best option to complete the sentence.","Elige la opción que completa mejor la oración."]};
function ylItemHTML(it,order,choice){
  const pic=it.t==="word"||it.t==="def";
  return `${it.img?`<div class="scene"><img src="${YLI(it.img)}" alt=""></div>`:""}
   ${it.t==="word"?`<p class="bigword">${esc(it.q)}</p>`:it.q?`<p class="prompt">${promptHTML(it.q)}</p>`:""}
   ${pic?picOptsHTML(it.opts,order,choice):optionsHTML(it.opts,order,choice)}`;
}
function exampleHTML(ex,col){
  const ins=YL_INS[ex.t];
  return `<div class="example" style="--c:${col}"><span class="extag">Ejemplo</span><p class="exins">${ins[1]}</p>${ylItemHTML(ex,ex.opts.map((_,i)=>i),0)}<p class="exnote">La respuesta correcta está marcada.</p></div>`;
}
function promptHTML(t){return esc(t).replace(/_{3}/,'<span class="gap"></span>')}

function vQuestion(){
  const sec=SECTIONS[S.sectionIdx], st=secState(sec), c=S.cur;
  const n=sec.type==="item"?sec.n:sec.sets*sec.per;
  const num=st.answers.length+1;
  const stl=SEC_STYLE[sec.id];
  const qhead=`<div class="qhead"><span class="chip" style="background:${stl.c}">${sec.name}</span><span class="qn">Pregunta ${num} de ${n}</span></div>`;
  let body="";
  if(sec.type==="item"){
    const it=sec.bank[c.idx];
    if(!Array.isArray(it)){
      const ins=YL_INS[it.t];
      body=`<div class="qcard">${qhead}<p class="instr">${ins[0]}<br><span class="ines">${ins[1]}</span></p>${ylItemHTML(it,c.order,c.choice)}
      <div class="next"><button class="dlbtn nx" id="nx" ${c.choice===null?"disabled":""}>Siguiente</button></div></div>`;
    }else
    body=`<div class="qcard">${qhead}<p class="instr">Choose the best option to complete the sentence.</p>
      <p class="prompt">${promptHTML(it[1])}</p>${optionsHTML(it[2],c.order,c.choice)}
      <div class="next"><button class="dlbtn nx" id="nx" ${c.choice===null?"disabled":""}>Siguiente</button></div></div>`;
  }else if(sec.id==="reading"){
    const set=sec.bank[c.idx], q=set.qs[c.qi];
    body=`<div class="split">
      <article class="passage" style="--c:${stl.c}"><span class="ptag">Reading text</span><h4>${esc(set.title)}</h4>${set.img?`<img class="pimg" src="${YLI(set.img)}" alt="">`:""}${set.paras.map(p=>{const e=esc(p);if(set.notice){const i=e.indexOf(":");return `<p><b>${e.slice(0,i+1)}</b>${e.slice(i+1)}</p>`}return `<p>${e}</p>`}).join("")}</article>
      <div class="qcard">${qhead}<p class="instr">Question ${c.qi+1} of ${set.qs.length} about this text${STG.kids?`<br><span class="ines">Lee el cuento y elige la respuesta correcta.</span>`:""}</p>
        <p class="prompt">${esc(q[0])}</p>${q[2]==="pic"?picOptsHTML(q[1],c.orders[c.qi],c.choice):optionsHTML(q[1],c.orders[c.qi],c.choice)}
        <div class="next"><button class="dlbtn nx" id="nx" ${c.choice===null?"disabled":""}>Siguiente</button></div></div>
    </div>`;
  }else{
    const set=sec.bank[c.idx], q=set.qs[c.qi], left=2-c.plays;
    body=`<div class="player${playing?" playing":""}" id="player" style="--c:${stl.c}">
        <button class="play" id="pl" ${left<=0||playing?"disabled":""} aria-label="Reproducir audio">${ICON.play}</button>
        <div><b>${esc(set.title)}</b><small id="plays">${playing?"Reproduciendo…":left>0?`Puedes escucharlo ${left===2?"2 veces":"1 vez más"}`:"Ya lo escuchaste 2 veces"}</small></div>
        <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="qcard">${qhead}<p class="instr">Question ${c.qi+1} of ${set.qs.length} about this audio${STG.kids?`<br><span class="ines">Escucha el audio y elige la respuesta correcta.</span>`:""}</p>
        <p class="prompt">${esc(q[0])}</p>${q[2]==="pic"?picOptsHTML(q[1],c.orders[c.qi],c.choice):optionsHTML(q[1],c.orders[c.qi],c.choice)}
        <div class="next"><button class="dlbtn nx" id="nx" ${c.choice===null?"disabled":""}>Siguiente</button></div></div>`;
  }
  app.innerHTML=header()+`<div class="wrap qwrap${STG.kids?" kids":""}" style="--c:${stl.c};--b:${stl.b}">${body}</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    c.choice=+b.dataset.i;save();
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));
    $("#nx").disabled=false;
  });
  $("#nx").onclick=()=>{$("#nx").disabled=true;answer();if(sec.type==="item"||sec.id==="reading")window.scrollTo({top:0})};
  const pl=$("#pl");
  if(pl) pl.onclick=()=>{
    if(c.plays>=2||playing) return;
    c.plays++;save();
    const set=sec.bank[c.idx];
    pl.disabled=true;$("#player").classList.add("playing");
    $("#plays").textContent="Reproduciendo…";
    playSet(set,()=>{
      playing=false;
      const box=$("#player"),btn=$("#pl"),lab=$("#plays");if(!box)return;
      box.classList.remove("playing");
      const left=2-S.cur.plays;
      btn.disabled=left<=0;
      lab.textContent=left>0?`Puedes escucharlo ${left===2?"2 veces":"1 vez más"}`:"Ya lo escuchaste 2 veces";
    });
  };
  tickClock();
}

/* ============ Certificate ============ */
function img(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function wrapText(ctx,text,x,y,maxW,lh){
  const words=text.split(" ");let line="",lines=[];
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
  lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return lines.length;
}
/* ============ Results design (approved v5) ============ */

function safeName(){return S.name.replace(/[\\/:*?"<>|]/g,"").trim()}
async function fontsReady(){
  const f=['800 40px Poppins','700 40px Poppins','600 40px Poppins','500 40px Poppins','400 40px Poppins','400 40px "Pinyon Script"'];
  try{await Promise.all(f.map(x=>document.fonts.load(x)));await document.fonts.ready}catch(e){}

/* baseline from CSS box top: lh = line-height px, fs = font size (Poppins metrics) */
function bl(top,lh,fs){return top+(lh-1.4*fs)/2+1.05*fs}
function spaced(x,t,cx,y,sp,align){
  const ch=[...t];const w=ch.reduce((s,c)=>s+x.measureText(c).width,0)+sp*(ch.length-1);
  let p=align==="left"?cx:align==="right"?cx-w:cx-w/2;
  x.textAlign="left";for(const c of ch){x.fillText(c,p,y);p+=x.measureText(c).width+sp}
  return w;
}
function dots(x,list){
  for(const [l,t,d,c,ring] of list){
    x.beginPath();
    if(ring){x.arc(l+d/2,t+d/2,d/2-ring/2,0,Math.PI*2);x.lineWidth=ring;x.strokeStyle=CC[c];x.stroke()}
    else{x.arc(l+d/2,t+d/2,d/2,0,Math.PI*2);x.fillStyle=CC[c];x.fill()}
  }
}
function rrect(x,l,t,w,h,r){x.beginPath();x.moveTo(l+r,t);x.arcTo(l+w,t,l+w,t+h,r);x.arcTo(l+w,t+h,l,t+h,r);x.arcTo(l,t+h,l,t,r);x.arcTo(l,t,l+w,t,r);x.closePath()}
function poly(x,pts,fill){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=fill;x.fill()}
function rosette(x,left,top,size,code){
  x.save();x.translate(left,top);const s=size/300;x.scale(s,s);
  poly(x,[[108,225],[70,372],[104,350],[126,378],[152,240]],"#E07A5F");poly(x,[[118,230],[92,340],[104,332]],"#C8644A");
  poly(x,[[192,225],[230,372],[196,350],[174,378],[148,240]],"#6FA8C9");poly(x,[[182,230],[208,340],[196,332]],"#5690B2");
  const n=40,pts=[];for(let i=0;i<n*2;i++){const r=i%2?112:130,a=Math.PI*i/n;pts.push([150+r*Math.sin(a),150-r*Math.cos(a)])}
  const g=x.createLinearGradient(20,20,280,280);g.addColorStop(0,"#F6DB8E");g.addColorStop(.5,"#D9A441");g.addColorStop(1,"#B37E25");
  poly(x,pts,g);
  x.beginPath();x.arc(150,150,100,0,Math.PI*2);x.fillStyle=INK;x.fill();
  x.beginPath();x.arc(150,150,90,0,Math.PI*2);x.strokeStyle="#F2C86B";x.lineWidth=2;x.stroke();
  x.beginPath();x.setLineDash([2,4]);x.arc(150,150,84,0,Math.PI*2);x.lineWidth=.8;x.stroke();x.setLineDash([]);
  x.fillStyle="#F2C86B";x.font='600 15px Poppins, sans-serif';spaced(x,"ENGLISH LEVEL",150,112,3.5);
  let fs=76;x.font=`800 ${fs}px Poppins, sans-serif`;while(x.measureText(code).width>150&&fs>30){fs-=2;x.font=`800 ${fs}px Poppins, sans-serif`}
  x.fillStyle="#fff";x.textAlign="center";x.fillText(code,150,190-(76-fs)*.35);
  x.fillStyle="#C9D3DA";x.font='500 12px Poppins, sans-serif';spaced(x,"LEVEL UP",150,218,2);
  x.restore();
}
function underline(x,cx,y,w,h){const g=x.createLinearGradient(cx-w/2,0,cx+w/2,0);g.addColorStop(0,"rgba(217,164,65,0)");g.addColorStop(.5,"#D9A441");g.addColorStop(1,"rgba(217,164,65,0)");x.fillStyle=g;x.fillRect(cx-w/2,y,w,h)}
function wrapLines(x,text,maxW){const words=text.split(" ");let line="",out=[];for(const w of words){const t=line?line+" "+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line);return out}

async function drawCertificate(){
  await fontsReady();
  const R=results(),code=LEVELS[R.lv].c,K=3300/1056;
  const cv=document.createElement("canvas");cv.width=3300;cv.height=2550;const x=cv.getContext("2d");
  x.scale(K,K);x.fillStyle="#fff";x.fillRect(0,0,1056,816);
  dots(x,CERT_DOTS);
  const logo=await img(LOGO);if(logo)x.drawImage(logo,413,76,230,69);
  const cx=528;x.textBaseline="alphabetic";

  x.font='500 11.5px Poppins, sans-serif';x.fillStyle=SOFT;let w=spaced(x,"DATE",56,56.7,.69,"left");
  x.font='600 11.5px Poppins, sans-serif';x.fillStyle=INK;spaced(x,dateEN(),56+w+8,56.7,.69,"left");
  x.font='600 11.5px Poppins, sans-serif';w=spaced(x,S.folio,1000,56.7,.69,"right");
  x.font='500 11.5px Poppins, sans-serif';x.fillStyle=SOFT;spaced(x,"CERTIFICATE NO.",1000-w-8,56.7,.69,"right");
  x.fillStyle=INK;x.font='800 54px Poppins, sans-serif';spaced(x,"CERTIFICATE",cx,bl(167,54,54),8.64);
  x.fillStyle="#E07A5F";x.font='600 17px Poppins, sans-serif';spaced(x,"OF ENGLISH LEVEL",cx,bl(233,25.5,17),7.14);
  x.fillStyle=SOFT;x.font='400 16px Poppins, sans-serif';x.textAlign="center";x.fillText("This certificate is proudly presented to:",cx,bl(283,24,16));
  let fs=44;x.font=`700 ${fs}px Poppins, sans-serif`;while(x.measureText(S.name).width>760&&fs>26){fs-=1;x.font=`700 ${fs}px Poppins, sans-serif`}
  x.fillStyle=INK;x.textAlign="center";x.fillText(S.name,cx,bl(312,50.6,44)-(44-fs)*.4);
  underline(x,cx,372.6,Math.max(x.measureText(S.name).width+60,300),2);
  x.fillStyle=DESC;x.font='400 14.5px Poppins, sans-serif';
  wrapLines(x,DESC_TXT,560).forEach((l,i)=>x.fillText(l,cx,bl(389,22.475,14.5)+i*22.475));
  // chips
  const chips=R.per.map(p=>{x.font='600 13px Poppins, sans-serif';const tw=x.measureText(p.sec.name).width;x.font='700 13px Poppins, sans-serif';const bw=x.measureText(LEVELS[p.lv].c).width+20;return {p,tw,bw,w:16+tw+8+bw+6}});
  let cxp=cx-(chips.reduce((s,c)=>s+c.w,0)+10*(chips.length-1))/2;
  for(const c of chips){
    rrect(x,cxp,450,c.w,36,18);x.fillStyle="#F6F7F8";x.fill();
    x.fillStyle=INK;x.font='600 13px Poppins, sans-serif';x.textAlign="left";x.fillText(c.p.sec.name,cxp+16,bl(450,36,13));
    const bx=cxp+16+c.tw+8;rrect(x,bx,456,c.bw,24,12);x.fillStyle=SEC_STYLE[c.p.sec.id].c;x.fill();
    x.fillStyle="#fff";x.font='700 13px Poppins, sans-serif';x.textAlign="center";x.fillText(LEVELS[c.p.lv].c,bx+c.bw/2,bl(456,24,13));
    cxp+=c.w+10;
  }
  rosette(x,428,494,200,code);
  // signatures
  [[262.5,COORDS[0]],[793.5,COORDS[1]]].forEach(([sx,nm])=>{
    x.fillStyle=INK;x.textAlign="center";x.font='400 40px "Pinyon Script", cursive';x.fillText(nm,sx,692);
    x.fillRect(sx-140.5,703,281,1);
    x.font='600 13px Poppins, sans-serif';x.fillText(nm,sx,725.3);
    x.fillStyle=SOFT;x.font='500 11.5px Poppins, sans-serif';spaced(x,"COORDINATOR",sx,743.6,1.61);

  return cv;
}

/* Minimal PDF (letter landscape) with the certificate as a high-res JPEG */
function canvasToPDF(cv){
  const b64=cv.toDataURL("image/jpeg",0.95).split(",")[1],bin=atob(b64),jpg=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)jpg[i]=bin.charCodeAt(i);
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=d=>{const u=typeof d==="string"?enc.encode(d):d;parts.push(u);len+=u.length};
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);body();push("\nendobj\n")};
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const content="q 792 0 0 612 0 0 cm /Im0 Do Q";
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
  obj(3,()=>push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 792 612] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>"));
  obj(4,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push("\nendstream")});
  obj(5,()=>push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
  const xref=len;let t="xref\n0 6\n0000000000 65535 f \n";for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(t+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
function saveBlob(blob,fname){
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),6000);
}
async function downloadCert(){
  const btn=$("#dl"),t=btn.textContent;btn.disabled=true;btn.textContent="Generating…";
  try{const cv=await drawCertificate();saveBlob(canvasToPDF(cv),"Certificate Level Up - "+safeName()+".pdf");toast("Certificado descargado")}
  catch(e){toast("No se pudo generar el certificado")}
  btn.disabled=false;btn.textContent=t;
}
async function downloadStory(){
  const btn=$("#dls"),t=btn.textContent;btn.disabled=true;btn.textContent="Generating…";
  try{const cv=await drawStory();await new Promise(r=>cv.toBlob(b=>{saveBlob(b,"Level Up Story - "+safeName()+".png");r()},"image/png"));toast("Historia descargada")}
  catch(e){toast("No se pudo generar la historia")}
  btn.disabled=false;btn.textContent=t;
}
