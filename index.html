body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(520px 420px at 8% 4%,rgba(142,166,147,.28),transparent 70%),radial-gradient(480px 380px at 96% 30%,rgba(194,166,110,.18),transparent 70%),radial-gradient(560px 460px at 30% 105%,rgba(124,150,168,.18),transparent 70%)}
body{
  font-family:var(--sans);color:var(--ink);background:var(--cream);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sand);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:28px 22px 48px}
.logo{display:block;width:min(300px,70vw);height:auto;margin:8px auto 0}
.plant{display:block;width:84px;height:auto;margin:0 auto}

/* Welcome */
.hero{text-align:center;padding:28px 0 8px}
.hero h1{font-weight:700;font-size:clamp(46px,7vw,68px);line-height:1;margin:38px 0 0;letter-spacing:-.035em;color:var(--teal)}
.hero .sub{font-size:clamp(19px,2.6vw,23px);font-weight:500;color:var(--ink);margin:12px 0 0;letter-spacing:-.005em}
.hero .rule{width:56px;height:3px;border-radius:3px;background:var(--teal);opacity:.35;margin:22px auto 20px}
.skills{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 auto;max-width:560px}
.skills span{display:inline-flex;align-items:center;gap:8px;background:rgba(251,250,246,.75);border:1px solid var(--line);border-radius:99px;padding:7px 14px 7px 12px;font-size:15px;font-weight:500;color:var(--ink)}
.skills i{width:9px;height:9px;border-radius:50%}
.hero .note{font-size:15.5px;color:var(--soft);margin:16px auto 0;max-width:480px;line-height:1.5}
.panel{background:var(--paper);border-radius:28px;padding:30px;margin-top:30px;box-shadow:0 1px 0 rgba(73,108,112,.08)}
.field label{display:block;font-weight:600;font-size:16px;margin-bottom:10px}
.field input{width:100%;font:inherit;font-size:20px;padding:16px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.field input:focus{border-color:var(--teal);outline:none}
.stage-title{font-weight:600;font-size:16px;margin:28px 0 12px}
.stages{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.stage{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px 18px 16px;color:var(--ink);min-height:118px}
.stage strong{display:block;font-size:19px;margin-bottom:4px}
.stage span{font-size:15px;color:var(--soft)}
.stage em{display:inline-block;font-style:normal;font-size:13px;margin-top:12px;padding:4px 10px;border-radius:99px;background:var(--cream);color:var(--soft)}
.stage[aria-pressed="true"]{border-color:var(--teal);background:#F1F4F2;box-shadow:inset 0 0 0 1.5px var(--teal)}
.stage:disabled{opacity:.55;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:99px;padding:18px 34px;font-size:18px;font-weight:600;background:var(--teal);color:#fff;min-width:220px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.btn-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
.resume{margin-top:22px;background:#F1F4F2;border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.resume p{margin:0;font-size:16px}

/* Prep */
.prep h2,.intro h2{font-weight:700;letter-spacing:-.025em;font-size:clamp(30px,4.6vw,42px);margin:22px 0 8px;text-align:center}
.prep .lead,.intro .lead{text-align:center;color:var(--soft);font-size:18px;margin:0 auto 6px;max-width:560px;line-height:1.5}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.checks li{display:flex;gap:16px;align-items:flex-start;font-size:17px;line-height:1.45}
.checks svg{flex:none;margin-top:2px}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}
.ov{border-radius:16px;padding:14px;background:#fff;border:1.5px solid var(--line)}
.ov b{display:block;font-size:16px}
.ov small{font-size:14px;color:var(--soft)}
.ov i{display:block;width:26px;height:6px;border-radius:9px;margin-bottom:10px}
.audiotest{margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#F1F4F2;border-radius:18px;padding:16px 18px}
.audiotest p{margin:0;font-size:16px;flex:1;min-width:200px}

/* Exam header */
.bar{position:sticky;top:0;z-index:5;background:var(--cream);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:16px}
.bar img{width:46px;height:auto}
.sections{display:flex;gap:6px;flex:1}
.sec{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.sec b{position:absolute;inset:0;width:0;border-radius:9px;transition:width .4s ease}
.clock{font-variant-numeric:tabular-nums;font-size:15px;color:var(--soft);min-width:52px;text-align:right}
.meta{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 14px;gap:12px}
.meta h3{margin:0;font-size:20px;font-weight:700}
.meta span{font-size:15px;color:var(--soft);font-variant-numeric:tabular-nums}

/* Question */
.qcard{background:var(--paper);border-radius:26px;padding:28px}
.prompt{font-size:22px;line-height:1.5;margin:0 0 22px;font-weight:500}
.prompt .gap{display:inline-block;min-width:84px;border-bottom:2px solid var(--teal);margin:0 4px;transform:translateY(-4px)}
.instr{font-size:15px;color:var(--soft);margin:0 0 10px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;font-size:19px;color:var(--ink);min-height:62px;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;background:var(--cream);color:var(--teal)}
.opt[aria-pressed="true"]{border-color:var(--teal);background:#F1F4F2}
.opt[aria-pressed="true"] .k{background:var(--teal);color:#fff}
.next{display:flex;justify-content:flex-end;margin-top:22px}

/* Reading split */
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.passage{background:#fff;border-radius:22px;padding:26px 28px;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:96px;border:1.5px solid var(--line)}
.passage h4{font-weight:700;letter-spacing:-.01em;font-size:24px;margin:0 0 14px;line-height:1.2}
.passage p{font-size:17.5px;line-height:1.7;margin:0 0 14px;max-width:62ch}
.passage .note{font-size:14px;color:var(--soft)}

/* Listening */
.player{display:flex;align-items:center;gap:20px;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:20px 22px;margin-bottom:18px}
.play{flex:none;width:72px;height:72px;border-radius:50%;border:0;background:var(--slate);display:grid;place-items:center}
.play:disabled{background:var(--line);cursor:not-allowed}
.play svg{width:28px;height:28px}
.player b{display:block;font-size:18px}
.player small{font-size:15px;color:var(--soft)}
.wave{display:flex;gap:4px;align-items:center;height:28px;margin-left:auto}
.wave i{width:4px;border-radius:4px;background:var(--slate);height:8px;opacity:.35}
.playing .wave i{opacity:1;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:8px}50%{height:26px}}

/* Intro */
.intro .badge{display:block;width:74px;height:74px;border-radius:24px;margin:26px auto 0;display:grid;place-items:center}
.intro .facts{display:flex;justify-content:center;gap:28px;margin-top:22px;flex-wrap:wrap}
.intro .facts div{text-align:center}
.intro .facts b{display:block;font-weight:700;font-size:36px;letter-spacing:-.02em;color:var(--teal)}
.intro .facts small{color:var(--soft);font-size:15px}

/* Results */
.result{text-align:center}
.result h2{font-weight:700;letter-spacing:-.025em;font-size:clamp(28px,4.4vw,40px);margin:24px 0 6px}
.result .who{color:var(--soft);font-size:18px;margin:0}
.levelbox{margin:26px auto 0;max-width:520px;background:var(--teal);color:#fff;border-radius:30px;padding:30px 26px}
.levelbox .lv{font-size:92px;line-height:1;font-weight:700;letter-spacing:-.03em}
.levelbox .ln{font-size:22px;font-weight:600;margin-top:8px}
.levelbox p{margin:12px auto 0;max-width:400px;font-size:16px;line-height:1.5;opacity:.9}
.secres{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.secres div{background:var(--paper);border-radius:18px;padding:16px 10px}
.secres small{display:block;font-size:14px;color:var(--soft)}
.secres b{display:block;font-weight:700;font-size:30px;margin-top:4px;color:var(--teal)}
.secres i{display:block;width:22px;height:5px;border-radius:9px;margin:0 auto 8px}
.coord{margin-top:20px;background:var(--paper);border-radius:20px;padding:18px 20px;text-align:left}
.coord h4{margin:0 0 10px;font-size:16px}
.coord table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.coord td{padding:7px 0;border-top:1px solid var(--line)}
.coord td:last-child{text-align:right;color:var(--soft)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}

.modal{position:fixed;inset:0;background:rgba(46,68,70,.45);display:grid;place-items:center;padding:20px;z-index:30}
.modal div{background:var(--paper);border-radius:24px;padding:26px;max-width:420px;text-align:center}
.modal p{font-size:17px;line-height:1.5;margin:0 0 18px}

@media (max-width:760px){
  .stages{grid-template-columns:1fr}
  .stage{min-height:auto}
  .overview,.secres{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  .passage{position:static;max-height:none}
  .qcard{padding:22px}
  .prompt{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Results (approved design) */
.res{position:relative;overflow:hidden;background:#fff;border-radius:26px;padding:30px 24px 26px;text-align:center;max-width:520px;margin:6px auto 0;box-shadow:0 12px 34px rgba(31,46,58,.09);font-family:Poppins,var(--sans);color:#1F2E3A}
.res .dot{position:absolute;border-radius:50%;pointer-events:none}
.res img.wm{position:relative;width:170px;height:auto}
.res .kick{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.32em;color:#6B7A84;margin:20px 0 8px}
.res .stagepill{display:inline-block;font-family:var(--sans);font-size:14px;font-weight:600;color:#fff;background:linear-gradient(90deg,#E07A5F,#D9A441);border-radius:999px;padding:6px 16px;letter-spacing:.04em}
.res .name{font-size:clamp(24px,4.4vw,30px);font-weight:700;line-height:1.15;margin:18px 0 0}
.res .lvbox{background:#1F2E3A;color:#fff;border-radius:22px;padding:28px 20px;margin:22px 0 16px;position:relative;overflow:hidden}
.res .lvbox i{position:absolute;border-radius:50%}
.res .lvbox small{display:block;font-size:13px;letter-spacing:.24em;text-transform:uppercase;opacity:.8;position:relative}
.res .lvbox b{display:block;font-size:60px;line-height:1.1;margin:4px 0;font-weight:800;color:#F2C86B;position:relative}
.res .lvbox p{margin:0 auto;max-width:400px;font-size:15px;opacity:.92;position:relative;line-height:1.5}
.res .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res .sc{border-radius:16px;padding:13px 12px;background:#fff;border:1.5px solid;display:flex;align-items:center;justify-content:space-between}
.res .sc small{font-size:14px;font-weight:600}
.res .sc b{font-size:21px;font-weight:700;color:#fff;border-radius:10px;padding:2px 11px}
.res .dlbtn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:600 16px Poppins,var(--sans);margin-top:10px}
.res .dlbtn:disabled{opacity:.6}
.coord{max-width:520px;margin-left:auto;margin-right:auto}

.res .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.res .sc{gap:8px;min-width:0}
.res .sc .ttl,.res .sc small{min-width:0}
.res .sc b{flex:none}
@media (max-width:480px){
  .wrap{padding-left:14px;padding-right:14px}
  .res{padding:24px 16px 20px;border-radius:22px}
  .res .lvbox{padding:22px 14px}
  .res .sc{padding:11px 10px}
  .res .sc small{font-size:13px}
  .res .sc .q{display:none!important}
  .res .lvbox i:nth-of-type(4),.res .lvbox i:nth-of-type(5){display:none}
  .res .lvbox p{padding:0 6px}
  .res .sc b{font-size:18px;padding:2px 9px}
  .res .bigt{font-size:44px}
  .res .lvbox p{font-size:14px}
}
.prepcard .checks{margin-top:24px;text-align:left}
.prepcard .checks li{font-size:15px;line-height:1.5;gap:12px}
.prepcard .audiotest{text-align:left;background:#F6F7F8;margin-top:22px}
.prepcard .audiotest .play{background:#1F2E3A!important}
.prepcard .audiotest p{font-size:14.5px}
/* Welcome (same design as results) */
.res .hello{font-size:13px;letter-spacing:.24em;text-transform:uppercase;opacity:.8;position:relative;display:block}
.res .bigt{display:block;font-size:clamp(46px,9vw,62px);line-height:1.05;margin:6px 0 8px;font-weight:800;color:#F2C86B;position:relative;letter-spacing:-.02em}
.res .sc .q{display:block;font-size:12.5px;font-weight:500;color:#6B7A84;margin-top:1px}
.res .sc .ttl{text-align:left}
.res .meta2{font-size:14px;color:#6B7A84;margin:14px 0 0}
.res .fld{text-align:left;margin-top:24px}
.res .fld label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.res .fld input{width:100%;font:500 18px Poppins,var(--sans);padding:14px 16px;border:1.5px solid #DDE2E6;border-radius:14px;background:#fff;color:#1F2E3A}
.res .fld input:focus{border-color:#1F2E3A;outline:none}
.res .stg{display:grid;gap:8px}
.res .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid #E6E9EC;border-radius:14px;padding:12px 14px;font-family:Poppins,var(--sans);color:#1F2E3A}
.res .opt strong{display:block;font-size:15px;font-weight:600}
.res .opt span{font-size:12.5px;color:#6B7A84}

{lvl:3,title:"Why Teenagers Can’t Get Up Early",paras:[
"Many parents think their teenage children are lazy because they stay up late and find it hard to wake up in the morning. However, scientists say the real reason is biological. During adolescence, the body starts producing melatonin, the hormone that makes us feel sleepy, about two hours later than in children or adults. This means that a typical teenager doesn’t feel tired until around 11 p.m. or even midnight.",
"The problem is that most schools start early. If a student has to wake up at 6 a.m., they may only get six or seven hours of sleep, while experts recommend between eight and ten. Lack of sleep can affect concentration, mood and even school grades.",
"Some schools in the United States have decided to start classes later, at around 8:30 a.m. The results have been positive: students arrive on time more often, feel less stressed and do better in tests. Not everyone agrees, though. Some parents complain that a later start makes it difficult to organize their own work schedules."],

["How many hours of sleep do experts recommend for teenagers?",["Between eight and ten","Between six and seven","About eleven","Two more than adults"]],

["What happened in schools that started classes later?",["Students did better in tests.","Students went to bed even later.","All parents were happier.","Classes became shorter."]],

{lvl:4,title:"The Hidden Costs of Working from Home",paras:[
"When offices closed in 2020, millions of employees discovered that they could do their jobs from the kitchen table. Years later, remote and hybrid work have become permanent features of many industries, and surveys consistently show that workers value the flexibility. Without a daily commute, people save time and money, and many report a better balance between their professional and personal lives.",
"Yet the picture is not entirely positive. Researchers have found that remote employees often work longer hours, partly because the boundary between “office” and “home” becomes blurred. Checking emails late at night can easily become a habit. Others mention a sense of isolation: casual conversations with colleagues, which once happened naturally by the coffee machine, have largely disappeared, and with them an important source of informal learning and support.",
"Managers face challenges too. Some worry that it is harder to evaluate performance when they cannot see their team, although critics argue that this reflects outdated management styles rather than a real problem. Junior employees may be the most affected, since they traditionally learn by observing more experienced colleagues.",
"Most experts now recommend a balanced approach: allowing flexibility while creating regular opportunities for teams to meet in person."],
qs:[
["Which benefit of remote work is mentioned in the text?",["Saving time and money on commuting","Higher salaries","Fewer meetings","Faster promotions"]],
["Why do remote employees often work longer hours?",["The line between work and home becomes unclear.","Managers ask them to work more.","They have more tasks than before.","They have fewer colleagues to help them."]],
["In paragraph 2, the word “blurred” is closest in meaning to:",["unclear","strict","removed","visible"]],
["What do critics say about managers’ concerns?",["They reflect old-fashioned ways of managing.","They are completely justified.","They mainly affect junior employees.","They will disappear with new technology."]],
["Who may be most affected by remote work, according to the text?",["Junior employees","Managers","Experienced colleagues","Workers with long commutes"]]]},
{lvl:5,title:"In Praise of Boredom",paras:[
"For most of human history, boredom was an unavoidable part of daily life: waiting for a bus, standing in a queue or sitting through a long evening with nothing in particular to do. Today, such moments have all but vanished. The smartphone in our pocket ensures that every idle second can be filled instantly with news, messages or an endless stream of videos. At first glance, this seems like an unambiguous improvement. Who would choose tedium over entertainment?",
"A growing body of research, however, suggests that we may have underestimated what boredom does for us. In one frequently cited study, participants who were first given a deliberately dull task, copying numbers from a telephone directory, subsequently produced more creative ideas than those who had not. The researchers concluded that boredom prompts the mind to wander, and that this wandering is precisely where unexpected connections are made.",
"None of this means that we should romanticize monotony. Chronic boredom has been linked to anxiety and poor decision-making, and few people would argue that a tedious job is good for the soul. The point, rather, is that occasional, low-stakes boredom serves a purpose. By reflexively eliminating it, we may be depriving ourselves of the mental space in which reflection and imagination flourish.",
"Perhaps the solution is not to abandon our devices but to use them more deliberately: to leave the phone in another room now and then, and to tolerate, even welcome, a few minutes of doing nothing at all."],
qs:[
["What is the main idea of the text?",["Occasional boredom can be beneficial.","Smartphones should be banned.","Boredom always leads to anxiety.","Entertainment makes people more creative."]],
["What did the study mentioned in the text show?",["People who did a dull task first had more creative ideas afterwards.","People who copied numbers made more mistakes.","Bored people make worse decisions.","Telephone directories improve memory."]],
["In paragraph 3, “romanticize” is closest in meaning to:",["idealize","criticize","avoid","measure"]],
["What is the author’s view of chronic boredom?",["It can be harmful.","It is good for the soul.","It is extremely rare.","It improves imagination."]],
["What does the author recommend?",["Using our devices more deliberately","Getting rid of our phones completely","Looking for more tedious jobs","Doing creativity tests regularly"]]]}
];

/* ============ Adaptive engine ============ */
function secState(sec){
  if(!S.secs[sec.id]) S.secs[sec.id]={level:2,used:[],answers:[],setResults:[]};
  return S.secs[sec.id];
}
function pickIndex(bank,used,level,dir){
  const order=[level];
  for(let d=1;d<5;d++){ const a=level+(dir>=0?d:-d), b=level+(dir>=0?-d:d); order.push(a,b); }
  for(const l of order){
    if(l<1||l>5) continue;
    const pool=bank.map((x,i)=>i).filter(i=>!used.includes(i)&&(bank[i][0]===l||bank[i].lvl===l));
    if(pool.length) return pool[Math.floor(Math.random()*pool.length)];
  }
  return -1;
}
function serveNext(){
  const sec=SECTIONS[S.sectionIdx], st=secState(sec);
  if(sec.type==="item"){
    const last=st.answers[st.answers.length-1];
    const idx=pickIndex(sec.bank,st.used,st.level,last?(last.ok?1:-1):0);
    st.used.push(idx);
    S.cur={idx,order:shuffle([0,1,2,3]),choice:null};
  }else{
    const last=st.setResults[st.setResults.length-1];
    const idx=pickIndex(sec.bank,st.used,st.level,last?(last.r>=.6?1:-1):0);
    st.used.push(idx);
    const n=sec.bank[idx].qs.length;
    S.cur={idx,qi:0,orders:Array.from({length:n},()=>shuffle([0,1,2,3])),choice:null,correct:0,plays:0};
  }
  S.phase="q";save();render();
}
function answer(){
  const sec=SECTIONS[S.sectionIdx], st=secState(sec), c=S.cur;
  if(c.choice===null) return;
  if(sec.type==="item"){
    const item=sec.bank[c.idx], ok=c.order[c.choice]===0;
    st.answers.push({lvl:item[0],ok});
    st.level=Math.max(1,Math.min(5,st.level+(ok?1:-1)));
    if(st.answers.length>=sec.n) return finishSection();
    serveNext();
  }else{
    const set=sec.bank[c.idx], ok=c.orders[c.qi][c.choice]===0;
    st.answers.push({lvl:set.lvl,ok});
    if(ok) c.correct++;
    c.qi++;c.choice=null;
    if(c.qi<set.qs.length){save();keepAudio=playing;render();return}
    stopAudio();
    const r=c.correct/set.qs.length;
    st.setResults.push({lvl:set.lvl,r});
    st.level=Math.max(1,Math.min(5,st.level+(r>=.6?1:r<=.4?-1:0)));
    if(st.setResults.length>=sec.sets) return finishSection();
    serveNext();
  }
}
function finishSection(){
  S.cur=null;
  if(S.sectionIdx<SECTIONS.length-1){S.sectionIdx++;S.phase="intro"}
  else{S.phase="done";S.ended=Date.now()}
  save();render();window.scrollTo(0,0);
}
function ability(sec){
  /* Maximum-likelihood estimate with guessing (4 options): robust at both ends of the scale */
  const st=S.secs[sec.id]; if(!st||!st.answers.length) return 0;
  const a=st.answers; let best=0,bestLL=-1e9;
  for(let th=-0.5;th<=6.5;th+=0.05){
    let ll=0;
    for(const x of a){
      const p=.25+.75/(1+Math.exp(-2.2*(th-x.lvl)));
      ll+=Math.log(x.ok?p:1-p);
    }
    if(ll>bestLL){bestLL=ll;best=th}
  }
  return Math.max(0,Math.min(6,best));
}
const WEIGHTS={vocab:.25,grammar:.30,reading:.25,listening:.20};
function results(){
  const per=SECTIONS.map(sec=>{
    const st=S.secs[sec.id]||{answers:[]};
    const a=ability(sec);
    return {sec,a,lv:levelOf(a),ok:st.answers.filter(x=>x.ok).length,n:st.answers.length};
  });
  const overall=per.reduce((s,p)=>s+p.a*WEIGHTS[p.sec.id],0);
  return {per,overall,lv:levelOf(overall)};
}

/* ============ Audio (MP3 if present, device voice otherwise) ============ */
let voices=[];
function loadVoices(){voices=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^en(-|_)/i.test(v.lang))}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(g){
  const fem=/samantha|aria|jenny|zira|karen|victoria|female|susan|serena|allison|ava|google us english/i;
  const mal=/daniel|alex|guy|david|fred|male|tom|aaron|google uk english male|arthur/i;
  const us=voices.filter(v=>/en.US/i.test(v.lang));
  const list=us.length?us:voices;
  const rx=g==="M"?mal:fem;
  return list.find(v=>rx.test(v.name))||voices.find(v=>rx.test(v.name))||list[g==="M"?Math.min(1,list.length-1):0]||null;
}
let mp3=null, playing=false;
function stopAudio(){playing=false;if(mp3){mp3.pause();mp3=null}if(window.speechSynthesis)speechSynthesis.cancel()}
function speakLines(lines,done,rate){
  if(!window.speechSynthesis){done();return}
  speechSynthesis.cancel();
  let i=0;
  const next=()=>{
    if(!playing) return;
    if(i>=lines.length){done();return}
    const [who,text]=lines[i++];
    const u=new SpeechSynthesisUtterance(text.replace(/[‘’]/g,"'"));
    const v=pickVoice(who); if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";
    u.rate=rate||.95; u.pitch=who==="M"?.9:1.05;
    u.onend=()=>setTimeout(next,350); u.onerror=()=>setTimeout(next,200);
    speechSynthesis.speak(u);
  };
  next();
}
function playSet(set,onEnd){
  playing=true;
  const rate=set.lvl<=2?.88:.95;
  const fallback=()=>speakLines(set.lines,onEnd,rate);
  if(set.id){
    mp3=new Audio("audios/"+set.id+".mp3");
    let started=false;
    mp3.onplaying=()=>{started=true};
    mp3.onended=()=>{mp3=null;onEnd()};
    mp3.onerror=()=>{mp3=null;if(!started&&playing)fallback()};
    mp3.play().catch(()=>{if(!started&&playing){mp3=null;fallback()}});
  }else fallback();
}

function header(){
  const done=SECTIONS.map((s,i)=>{
    if(i<S.sectionIdx) return 1;
    if(i>S.sectionIdx) return 0;

    return st?st.answers.length/n:0;
  });

    <img src="${PLANT}" alt="">
    <div class="sections">${SECTIONS.map((s,i)=>`<div class="sec" title="${s.name}"><b style="background:${s.color};width:${done[i]*100}%"></b></div>`).join("")}</div>
    <div class="clock" id="clock"></div>
  </div></div>`;
}

/* ============ Certificate ============ */
function img(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function wrapText(ctx,text,x,y,maxW,lh){
  const words=text.split(" ");let line="",lines=[];
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
  lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return lines.length;
}

async function fontsReady(){

/* baseline from CSS box top: lh = line-height px, fs = font size (Poppins metrics) */
function bl(top,lh,fs){return top+(lh-1.4*fs)/2+1.05*fs}
function spaced(x,t,cx,y,sp,align){
  const ch=[...t];const w=ch.reduce((s,c)=>s+x.measureText(c).width,0)+sp*(ch.length-1);
  let p=align==="left"?cx:align==="right"?cx-w:cx-w/2;
  x.textAlign="left";for(const c of ch){x.fillText(c,p,y);p+=x.measureText(c).width+sp}
  return w;
}
function dots(x,list){
  for(const [l,t,d,c,ring] of list){
    x.beginPath();
    if(ring){x.arc(l+d/2,t+d/2,d/2-ring/2,0,Math.PI*2);x.lineWidth=ring;x.strokeStyle=CC[c];x.stroke()}
    else{x.arc(l+d/2,t+d/2,d/2,0,Math.PI*2);x.fillStyle=CC[c];x.fill()}
  }
}
function rrect(x,l,t,w,h,r){x.beginPath();x.moveTo(l+r,t);x.arcTo(l+w,t,l+w,t+h,r);x.arcTo(l+w,t+h,l,t+h,r);x.arcTo(l,t+h,l,t,r);x.arcTo(l,t,l+w,t,r);x.closePath()}
function poly(x,pts,fill){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=fill;x.fill()}
function rosette(x,left,top,size,code){
  x.save();x.translate(left,top);const s=size/300;x.scale(s,s);
  poly(x,[[108,225],[70,372],[104,350],[126,378],[152,240]],"#E07A5F");poly(x,[[118,230],[92,340],[104,332]],"#C8644A");
  poly(x,[[192,225],[230,372],[196,350],[174,378],[148,240]],"#6FA8C9");poly(x,[[182,230],[208,340],[196,332]],"#5690B2");
  const n=40,pts=[];for(let i=0;i<n*2;i++){const r=i%2?112:130,a=Math.PI*i/n;pts.push([150+r*Math.sin(a),150-r*Math.cos(a)])}
  const g=x.createLinearGradient(20,20,280,280);g.addColorStop(0,"#F6DB8E");g.addColorStop(.5,"#D9A441");g.addColorStop(1,"#B37E25");
  poly(x,pts,g);
  x.beginPath();x.arc(150,150,100,0,Math.PI*2);x.fillStyle=INK;x.fill();
  x.beginPath();x.arc(150,150,90,0,Math.PI*2);x.strokeStyle="#F2C86B";x.lineWidth=2;x.stroke();
  x.beginPath();x.setLineDash([2,4]);x.arc(150,150,84,0,Math.PI*2);x.lineWidth=.8;x.stroke();x.setLineDash([]);
  x.fillStyle="#F2C86B";x.font='600 15px Poppins, sans-serif';spaced(x,"ENGLISH LEVEL",150,112,3.5);
  let fs=76;x.font=`800 ${fs}px Poppins, sans-serif`;while(x.measureText(code).width>150&&fs>30){fs-=2;x.font=`800 ${fs}px Poppins, sans-serif`}
  x.fillStyle="#fff";x.textAlign="center";x.fillText(code,150,190-(76-fs)*.35);
  x.fillStyle="#C9D3DA";x.font='500 12px Poppins, sans-serif';spaced(x,"LEVEL UP",150,218,2);
  x.restore();
}
function underline(x,cx,y,w,h){const g=x.createLinearGradient(cx-w/2,0,cx+w/2,0);g.addColorStop(0,"rgba(217,164,65,0)");g.addColorStop(.5,"#D9A441");g.addColorStop(1,"rgba(217,164,65,0)");x.fillStyle=g;x.fillRect(cx-w/2,y,w,h)}
function wrapLines(x,text,maxW){const words=text.split(" ");let line="",out=[];for(const w of words){const t=line?line+" "+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line);return out}

/* Minimal PDF (letter landscape) with the certificate as a high-res JPEG */
function canvasToPDF(cv){
  const b64=cv.toDataURL("image/jpeg",0.95).split(",")[1],bin=atob(b64),jpg=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)jpg[i]=bin.charCodeAt(i);
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=d=>{const u=typeof d==="string"?enc.encode(d):d;parts.push(u);len+=u.length};
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);body();push("\nendobj\n")};
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const content="q 792 0 0 612 0 0 cm /Im0 Do Q";
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
  obj(3,()=>push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 792 612] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>"));
  obj(4,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push("\nendstream")});
  obj(5,()=>push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
  const xref=len;let t="xref\n0 6\n0000000000 65535 f \n";for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(t+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
function saveBlob(blob,fname){
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),6000);
}
async function downloadCert(){

  catch(e){toast("No se pudo generar el certificado")}

}
